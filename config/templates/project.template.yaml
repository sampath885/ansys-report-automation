# Generated by scripts/init_project_config.py — edit paths and admin fields before building.
bom_id: "{{ bom_id }}"
title: "{{ title }}"
customer: "{{ customer }}"
prepared_by:
  name: "CAE Engineer"
  role: "CAE Engr"
checked_by:
  name: "Checker"
  role: "CAE Engr"
approved_by:
  name: "Approver"
  role: "Sr. General Manager"
ansys_version: "{{ ansys_version }}"

project_dir: "{{ project_dir }}"
case_root: "{{ case_root }}"
image_folder: "exports"
excel_calcs: "{{ excel_calcs }}"
excel_bolt_preload: "{{ excel_bolt_preload }}"
excel_map_path: "../config/ep2737_excel_map.yaml"
template_path: "../templates/EP2737_report_template.docx"
section_content_path: "../config/ep2737_section_content.yaml"
style_shell_path: "../templates/EP2737_style_shell.docx"
reference_layout_path: "../templates/EP2737_layout_template.docx"
use_reference_front_matter: true
use_word_table_data: false
report_defaults_path: "{{ report_defaults_path }}"
use_dpf_golden_fallback: false
standards_tables_path: "../config/ep2737_standards_tables.yaml"
skip_images: true

equipment_spec:
  part_name: "{{ part_name }}"
  material_grade: "{{ material_grade }}"
  drawing_mass_kg: "{{ drawing_mass_kg }}"
  fe_mass_note: "Model Mass (Excluding Extended pipes & Counter Flanges)"

bolts:
  count: {{ bolt_count }}
  tensile_stress_area_mm2: 115.0
  shear_stress_area_mm2: 100.0
  report_yield_mpa: {{ yield_mpa }}
  extraction_mode: envelope
  shock_extraction_mode: first
  uniform_axial_from_preload: true

sections_enabled:
  - revision
  - scope
  - software
  - references
  - equipment
  - modelling
  - loads
  - materials
  - modal
  - static
  - harmonic_x
  - harmonic_y
  - harmonic_z
  - shock
  - design_calcs

operating_freq_hz: [10, 200]

materials:
  - name: "{{ primary_material }}"
    yield_mpa: {{ yield_mpa }}
    uts_mpa: {{ uts_mpa }}
    elongation_pct: 30
    static_allowable_mpa: {{ static_allowable_mpa }}
    fatigue_allowable_mpa: {{ fatigue_allowable_mpa }}

mesh_quality_criteria:
  aspect_ratio: { operator: "<", limit: 10 }
  skewness: { operator: "<", limit: 0.31 }
  jacobian_ratio: { operator: ">", limit: 0.97 }
  element_quality: { operator: ">=", limit: 0.77 }
  max_corner_angle_deg: { operator: "<=", limit: 100 }

modal:
  num_modes: 6
static:
  fos_target: 1.5
