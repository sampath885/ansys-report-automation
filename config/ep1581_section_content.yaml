    caption: 'Figure 34 - Modal Analysis: Mode 6'
    required: false
  - type: heading
    text: Modal Analysis Conclusions
    level: 3
  - type: paragraph
    when_style: ep1581
    field: intro_text
  - type: table
    when_style: ep1581
    caption: Table 14 - Modal Analysis Summary
    headers:
    - Sl. No
    - Frequency (Hz)
    - Operating Frequency
    - Dominant in Direction
    - Remark
    rows_path: summary_table
    columns:
