- key: shock
  section_key: shock
  heading: Load Case - 5 Shock Analysis - Transient Approach
  heading_level: 2
  parent_section: Details of the Loading and BC
  blocks:
  - type: heading
    text: Shock Analysis Boundary And Loading Conditions For Transient Analysis
    level: 3
  - type: reference_table
    ref_key: shock_pulse_specifications
  - type: heading
    text: Results of Shock Analysis
    level: 3
  - type: repeat
    items_path: directions
    item_prefix: shock_item
    blocks:
    - type: heading
      template: Equivalent Static Analysis in {shock_item.direction} Direction
      level: 3
    - type: figure_gallery
      when_style: ep1581
      analysis_folder_template: '{shock_item.analysis_folder}'
      subfolder: loading
      filename: loading_conditions_overview.png
      caption_template: 'Equivalent Static Analysis in {shock_item.direction}: Boundary Conditions'
    - type: figure
      slot_template: shock_{shock_item.key}_deformation
      caption_template: Total Deformation — shock {shock_item.direction}
      required: false
    - type: figure
      slot_template: shock_{shock_item.key}_stress_asm
      caption_template: Equivalent Von-Mises Stress — assembly, shock {shock_item.direction}
      required: false
    - type: figure
      slot_template: shock_{shock_item.key}_stress_flange
      caption_template: Equivalent Von-Mises Stress — flange, shock {shock_item.direction}
      required: false
    - type: figure_gallery
      when_style: ep1581
      analysis_folder_template: '{shock_item.analysis_folder}'
      category: material_stress
      caption_prefix: 'Equivalent Static {shock_item.direction}: Equivalent (von-Mises) Stress'
      caption_suffix: '- End Time'
    - type: table
      caption_template: 'Table {shock_item.table_no}: Bolt Loads: Shock in {shock_item.direction} direction'
      headers:
      - Bolt No
      - Maximum Axial Force (N)
      - Maximum Shear Force (N)
      - Tensile Stress Area mm2
      - Shear Stress Area mm2
      - Normal Stress
      - Shear Stress
      - Yield Stress MPa
      - Conclusion
      rows_path: bolt_loads
      when_field: bolt_loads
      columns:
      - bolt_no
      - axial_force_n
      - shear_force_n
      - tensile_stress_area_mm2
      - shear_stress_area_mm2
      - normal_stress_mpa
      - shear_stress_mpa
      - yield_stress_mpa
      - conclusion
  - type: heading
    text: Result Summary – Equivalent Static Analysis
    level: 3
  - type: table
    caption: 'Table 23: Result Summary – Equivalent Static Analysis'
    headers:
    - Sr. No
    - Direction
    - Material
    - Maximum Occurs on
    - Stresses Observed (MPa)
    - Allowable Stress (MPa)
    - Remarks
    rows_path: conclusion_table
    columns:
    - sr_no
    - direction
    - material
    - location
    - stress_mpa
    - allowable_mpa
    - remarks
  - type: narrative
