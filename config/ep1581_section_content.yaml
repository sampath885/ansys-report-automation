- key: design_calcs
  section_key: design_calcs
  heading: Design calculations of the Valve
  heading_level: 1
  blocks:
  - type: repeat
    items_path: discovered_sections
    item_prefix: calc_section
    blocks:
    - type: heading
      template: '{calc_section.title}'
      level: 2
    - type: table
      caption_template: '{calc_section.title}'
      raw_table: true
      headers_path: headers
      rows_path: raw_rows
      when_field: raw_rows
    - type: figure_placeholder
      caption_template: '{calc_section.title}'
      when_field: raw_rows
  - type: heading
    text: Thickness Calculation of Welded Plane Pipe Flange
    level: 2
    unless_field: discovered_sections
  - type: table
    caption: 'Table 25: Flange Thickness calculation'
    headers:
    - Parameter
    - Value
    - Unit
    - Verdict
    rows_path: end_flange
    columns:
    - label
    - value
    - unit
    - verdict
    unless_field: discovered_sections
  - type: heading
    text: Bolt Preload Calculations
    level: 2
    unless_field: discovered_sections
  - type: table
    caption: 'Table 26: Bolt pretension calculations'
    headers:
    - Parameter
    - Value
    - Unit
    rows_path: bolt_load
    columns:
    - label
    - value
    - unit
    unless_field: discovered_sections
  - type: heading
    text: Fatigue Strength Calculations
    level: 2
    unless_field: discovered_sections
  - type: paragraph
    template: '{methodology.fatigue_theory}'
  - type: reference_table
    ref_key: fatigue_strength_calculations
    unless_field: discovered_sections
  - type: reference_table
    ref_key: surface_finish_factors
  - type: reference_table
    ref_key: reliability_factors
  - type: narrative
