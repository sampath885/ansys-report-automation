    when_style: ep1581
    analysis_folder: static_structural
    category: reaction
    caption_prefix: Static Structural
    caption_suffix: '- End Time'
  - type: table
    caption: Table 19 - Bolt Force Summary Table
    headers:
    - Bolt No
    - Maximum Axial Force (N)
    - Maximum Shear Force (N)
    - Tensile Stress Area mm2
    - Shear Stress Area mm2
    - Normal Stress
    - Shear Stress
    - Yield Stress MPa
    - Conclusion
