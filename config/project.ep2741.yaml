image_resolve_mode: hybrid
semantic_image_fallback: auto

equipment_spec:
  part_name: "valve assembly"

sections_enabled:
  - revision
  - scope
  - software
  - references
  - equipment
  - modelling
  - modal
  - static
  - harmonic_x
  - harmonic_y
  - harmonic_z
  - shock
  - materials
  - design_calcs

