# Rules for matching auto-discover Mechanical exports to report figure slots.
# Used when image_resolve_mode is auto or hybrid (see project config).
#
# Each rule supports one of:
#   path: exact relative path under exports/
#   path_glob: glob pattern (e.g. mesh/mesh*.png)
#   folder_keywords + file: folder path must contain all keywords; path ends with file
#   folder_keywords + subpath + file: same, with subpath before filename
#   exclude_keywords: path must NOT contain any of these tokens

version: 1

rules:
  cad_isometric:
    path: geometry/geometry.png
  cad_section:
    path_glob: connections/*connections*.png
  geometry_model_orientation:
    path_glob: coordinate_systems/*coordinate*.png

  mesh_global:
    path_glob: mesh/mesh*.png
  mesh_quality_aspect:
    folder_keywords: [mesh]
    file: aspect_ratio.png
  mesh_skewness:
    folder_keywords: [mesh]
    file: skewness.png
  mesh_jacobian:
    folder_keywords: [mesh]
    file: jacobian_ratio.png
  modelling_contacts:
    path_glob: connections/*connections*.png

  static_earth_gravity:
    folder_keywords: [static]
    file: loading/standard_earth_gravity.png
    exclude_keywords: [modal, harmonic, vibration, shock, transient]
  static_fixed_support:
    folder_keywords: [static]
    file: loading/fixed_support.png
    exclude_keywords: [modal, harmonic, vibration, shock, transient]
  static_pressure:
    folder_keywords: [static]
    file: loading/pressure.png
    exclude_keywords: [modal, harmonic, vibration, shock, transient]
  static_total_deformation:
    folder_keywords: [static]
    file: solution/total_deformation.png
    exclude_keywords: [modal, harmonic, vibration, shock, transient]
  static_vonmises_stress:
    folder_keywords: [static]
    file: solution/equivalent_stress.png
    exclude_keywords: [modal, harmonic, vibration, shock, transient, flange]
  static_vonmises_flange:
