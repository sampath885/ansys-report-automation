bom_id: "EP 2737"
title: "WELDED PLANE PIPE FLANGE"
customer: "M/S ULTRA DIMENSIONS PVT. LTD., VISAKHAPATNAM"
prepared_by:
  name: "CAE Engineer"
  role: "CAE Engr"
checked_by:
  name: "Checker"
  role: "CAE Engr"
approved_by:
  name: "Approver"
  role: "Sr. General Manager"
ansys_version: "2025 R2"

# Workbench project folder (relative to repo root when loading from config/)
project_dir: "../EP 2737/Structural Analysis_EP2737"
# Case folder: Excel, STEP, exports live here
case_root: "../EP 2737"
image_folder: "exports"
excel_calcs: "OLF Mechanical Calculation of BOM IDs EP2737_1.xlsx"
excel_bolt_preload: "Bolt pre load.xlsx"
excel_map_path: "../config/ep2737_excel_map.yaml"
template_path: "../templates/EP2737_report_template.docx"
section_content_path: "../config/ep2737_section_content.yaml"
style_shell_path: "../templates/EP2737_style_shell.docx"
reference_layout_path: "../templates/EP2737_layout_template.docx"
use_reference_front_matter: true
# Layout-only from reference DOCX. Set true only for EP2737 regression against the sample report.
use_word_table_data: false
report_defaults_path: "../config/ep2737_report_defaults.yaml"
# Off for production: only RST/CAERep/Excel extraction. Use --golden-dpf for CI regression only.
use_dpf_golden_fallback: false
standards_tables_path: "../config/ep2737_standards_tables.yaml"
skip_images: true

sections_enabled:
  - revision
  - scope
  - software
  - references
  - equipment
  - modelling
  - loads
  - materials
  - modal
  - static
  - harmonic_x
  - harmonic_y
  - harmonic_z
  - shock
  - design_calcs

operating_freq_hz: [10, 200]
materials:
  - name: "ASTM 182 F 321"
    yield_mpa: 205
    uts_mpa: 515
    elongation_pct: 30
    static_allowable_mpa: 136.67
    fatigue_allowable_mpa: 68.2
modal:
  num_modes: 6
static:
  fos_target: 1.5

mesh_quality_criteria:
  aspect_ratio: { operator: "<", limit: 10 }
  skewness: { operator: "<", limit: 0.31 }
  jacobian_ratio: { operator: ">", limit: 0.97 }
  element_quality: { operator: ">=", limit: 0.77 }
  max_corner_angle_deg: { operator: "<=", limit: 100 }
