[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-report"
version = "0.1.0"
description = "Laptop-local ANSYS report automation: DPF extraction, Excel calcs, Word/PDF export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CAE Team" }]
dependencies = [
    "ansys-dpf-core>=0.12.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "docxtpl>=0.16.0",
    "python-docx>=1.1.0",
    "pillow>=10.0",
    "docx2pdf>=0.1.8",
    "typer>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.25.0", "openai>=1.0.0"]
mechanical = ["ansys-mechanical-core>=0.8.0"]
dev = ["pytest>=7.4", "ruff>=0.1.0"]

[project.scripts]
ansys-report = "ansys_report.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ansys: requires ANSYS/DPF installed (set ANSYS_AVAILABLE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
